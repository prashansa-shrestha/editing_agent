[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-agent"
version = "0.1.0"
description = "Local-first, training-free Gaussian scene editing primitives"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.1"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]
